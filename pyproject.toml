[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yearly"
version = "0.1.0"
description = "Yearly – year-at-a-glance calendar backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
# Run with: yearly-serve [--host 0.0.0.0] [--port 3000]
yearly-serve = "yearly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yearly"]